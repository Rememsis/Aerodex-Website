[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/auth/roblox"
  to = "/.netlify/functions/roblox-login"
  status = 200

[[redirects]]
  from = "/auth/roblox/callback"
  to = "/.netlify/functions/roblox-callback"
  status = 200

[[redirects]]
  from = "/logout"
  to = "/.netlify/functions/logout"
  status = 200

[[redirects]]
  from = "/api/me"
  to = "/.netlify/functions/me"
  status = 200

[[redirects]]
  from = "/creationsandproducts.html"
  to = "/CreationsandProducts.html"
  status = 200

[[redirects]]
  from = "/creationandproducts.html"
  to = "/CreationsandProducts.html"
  status = 200

[[redirects]]
  from = "/games.html"
  to = "/CreationsandProducts.html"
  status = 200

[[redirects]]
  from = "/gamepass.html"
  to = "/Gamepass.html"
  status = 200

[[redirects]]
  from = "/store.html"
  to = "/Gamepass.html"
  status = 200

# Keep this rule last so valid pages and function routes are matched first.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
